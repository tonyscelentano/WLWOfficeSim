<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The 5:00 PM Exit - Meeting Dodge</title>
    <link rel="stylesheet" href="/minigames/_shared/minigame.css">
    <link rel="stylesheet" href="game.css">
</head>
<body class="minigame-body">
    <div id="game-container">
        <div id="ui">
            <div id="timer">TIME UNTIL EXIT: 30s</div>
            <div id="status">STATUS: ESCAPING</div>
        </div>
        <canvas id="game-canvas" width="600" height="400"></canvas>
        <div id="overlay">
            <div id="overlay-content">
                <h1>THE 5:00 PM EXIT</h1>
                <p>Use Arrow Keys to dodge "Responsibilities"</p>
                <button id="start-btn">RUN FOR IT</button>
            </div>
        </div>
    </div>

    <script src="/minigames/_shared/minigame.js"></script>
    <script src="game.js"></script>
</body>
</html>
